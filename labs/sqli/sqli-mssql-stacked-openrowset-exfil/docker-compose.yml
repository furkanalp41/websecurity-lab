# SPDX-License-Identifier: MIT
name: websec-lab-sqli-mssql-stacked-openrowset-exfil

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/sqli-mssql-stacked-openrowset-exfil:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      DB_HOST: db
      DB_PORT: '1433'
      DB_NAME: inventory
      DB_USER: sa
      DB_PASSWORD: Mssql-Lab-Pw!42
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/lab:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8080/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - edge
      - backend

  db:
    # MSSQL Server 2022 Developer Edition (CU16) on Ubuntu 22.04. Heavy-tier lab:
    # ~1.5 GB image, 2 GB RAM. Runs in the nightly matrix only. The sqlservr binary
    # carries a cap_net_bind_service=ep file capability for binding privileged ports
    # (RPC 135); cap_add NET_BIND_SERVICE lets the bounding set honour it under
    # cap_drop ALL + no-new-privileges. No other capabilities required.
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04@sha256:45a1a9d13ca5574cf8e0fe4ae73ab77248b66d9c3132ac9658fb6c16dd72a8af
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Mssql-Lab-Pw!42
      MSSQL_PID: developer
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Anonymous volume auto-populates from image contents. MSSQL writes database
      # files, logs, and config under /var/opt/mssql; the image ships template
      # master/model/msdb data files that get copied here on first start.
      - /var/opt/mssql
    cap_drop:
      - ALL
    cap_add:
      # sqlservr has cap_net_bind_service=ep file capability. Without this in the
      # bounding set, execve returns EPERM. This is the ONLY added cap; it permits
      # binding to ports <1024 and provides zero privilege escalation.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 500
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Mssql-Lab-Pw!42" -C -Q "SELECT 1" -b -o /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

networks:
  edge:
    name: websec-lab_sqli-mssql-openrowset_edge
    driver: bridge
    internal: false
  # Egress-drop: MSSQL on this no-egress bridge. The DB cannot reach the internet;
  # only the dual-homed app can talk to it.
  backend:
    name: websec-lab_sqli-mssql-openrowset_backend
    driver: bridge
    internal: true
