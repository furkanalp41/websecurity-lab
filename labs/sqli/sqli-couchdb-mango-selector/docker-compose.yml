# SPDX-License-Identifier: MIT
name: websec-lab-sqli-couchdb-mango-selector

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/sqli-couchdb-mango-selector:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      COUCHDB_URL: http://db:5984
      COUCHDB_USER: labadmin
      COUCHDB_PASSWORD: vault-service-pw
      COUCHDB_DB: restricted
    # labctl rewrites this to 127.0.0.1:<allocated>:8080 at launch; :0 = ephemeral for local/CI.
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/lab:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8080/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

  db:
    image: couchdb:3.4@sha256:628c4952c1cf668489fb668fbd24013bf61ff25add0a3643253dde0d47cae449
    # Run CouchDB as its non-root uid (5984). The read-only root filesystem is
    # backed by uid-5984 tmpfs mounts for every path CouchDB writes at boot:
    #   * /opt/couchdb/data          — the database files
    #   * /opt/couchdb/etc/local.d   — docker-entrypoint.sh touches/writes docker.ini
    #                                  here, and CouchDB rewrites the hashed admin
    #                                  password back into it on first start
    #   * /tmp                       — HOME is pointed here so any Erlang cookie
    #                                  file lands on a writable tmpfs, not the RO root
    # Logging goes to stderr (the image removes 10-filelog.ini), so no log dir is needed.
    user: '5984:5984'
    environment:
      COUCHDB_USER: labadmin
      COUCHDB_PASSWORD: vault-service-pw
      HOME: /tmp
    read_only: true
    tmpfs:
      - /opt/couchdb/data:uid=5984,gid=5984,mode=0700,size=256m
      - /opt/couchdb/etc/local.d:uid=5984,gid=5984,mode=0700,size=8m
      - /tmp:uid=5984,gid=5984,mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      # No curl/wget in the image, so probe /_up over bash's /dev/tcp. The port
      # only answers once chttpd is up, and /_up is public (no auth).
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/5984 && printf "GET /_up HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

networks:
  labnet:
    name: websec-lab_sqli-couchdb-mango-selector_net
    driver: bridge
    # Dedicated per-lab bridge. Not `internal: true`: Docker disables host port
    # publishing on internal networks, and the learner reaches the app via its
    # published 127.0.0.1 port. The DB publishes no ports at all.
    internal: false
