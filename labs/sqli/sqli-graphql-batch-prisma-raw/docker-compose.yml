# SPDX-License-Identifier: MIT
name: websec-lab-sqli-graphql-batch-prisma-raw

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/sqli-graphql-batch-prisma-raw:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      DATABASE_URL: postgresql://reportsuser:field-report-pw@db:5432/reports
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/lab:size=16m,mode=1777
      - /home/node:uid=1000,gid=1000,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://127.0.0.1:8080/health | grep -q ok || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: '70:70'
    environment:
      POSTGRES_USER: reportsuser
      POSTGRES_PASSWORD: field-report-pw
      POSTGRES_DB: reports
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=192m
      - /run/postgresql:uid=70,gid=70,size=8m
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reportsuser -d reports -h 127.0.0.1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

networks:
  labnet:
    name: websec-lab_sqli-graphql-batch-prisma-raw_net
    driver: bridge
    internal: false
