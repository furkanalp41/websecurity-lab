# SPDX-License-Identifier: MIT
name: websec-lab-sqli-rails-active-record-hash

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/sqli-rails-active-record-hash:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_LOG_TO_STDOUT: '1'
      RAILS_MAX_THREADS: '8'
      SECRET_KEY_BASE: lab-fixed-insecure-key-sqli-rails-active-record-hash-do-not-reuse
      DATABASE_URL: postgres://reportsapp:reports-lab-pw@db:5432/reports_db
    # labctl rewrites this to 127.0.0.1:<allocated>:8080 at launch; :0 = ephemeral for local/CI.
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/lab:size=16m,mode=1777
      - /opt/app/tmp:uid=10001,gid=10001,size=32m,mode=0770
      - /opt/app/log:uid=10001,gid=10001,size=16m,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test:
        - CMD-SHELL
        - 'ruby -e "require %q{net/http}; exit(Net::HTTP.get(URI(%q{http://127.0.0.1:8080/health})) == %q{ok} ? 0 : 1)" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: '70:70'
    environment:
      POSTGRES_USER: reportsapp
      POSTGRES_PASSWORD: reports-lab-pw
      POSTGRES_DB: reports_db
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=192m
      - /run/postgresql:uid=70,gid=70,size=8m
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reportsapp -d reports_db -h 127.0.0.1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

networks:
  labnet:
    name: websec-lab_sqli-rails-active-record-hash_net
    driver: bridge
    # Dedicated per-lab bridge isolates this lab from every other lab. Not
    # `internal: true`: Docker disables host port publishing on internal
    # networks, and the learner reaches the app via its published 127.0.0.1
    # port. The DB publishes no ports and is reachable only on this bridge.
    internal: false
