# SPDX-License-Identifier: MIT
name: websec-lab-sqli-layerslider-unauth-time-blind

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/sqli-layerslider-unauth-time-blind:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: wpdb
      DB_USER: wpapp
      DB_PASSWORD: wp-app-pw
    # labctl rewrites this to 127.0.0.1:<allocated>:8080 at launch; :0 = ephemeral for local/CI.
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/lab:size=16m,mode=1777
      - /run/apache2:size=8m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:8080/health 2>/dev/null | grep -q ok || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

  db:
    image: mariadb:11.4@sha256:611a2fcc5fa7c6ceb8644c6f74b25ede004ff6c3a6b38c8f8c23d3bbf6c26430
    # Run mariadbd as the non-root mysql uid (999). The tmpfs data/socket dirs
    # below are owned by 999 so the server initialises a fresh datadir on every
    # start despite the read-only root filesystem.
    user: '999:999'
    # Trim MariaDB's footprint so the whole service (RSS + tmpfs datadir) fits
    # inside mem_limit, and shrink the on-disk (tmpfs) datadir.
    command:
      - mariadbd
      - --skip-name-resolve
      - --skip-log-bin
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-file-size=16M
    environment:
      MARIADB_ROOT_PASSWORD: wp-root-pw
      MARIADB_DATABASE: wpdb
      MARIADB_USER: wpapp
      MARIADB_PASSWORD: wp-app-pw
    read_only: true
    tmpfs:
      - /var/lib/mysql:uid=999,gid=999,mode=0700,size=256m
      - /run/mysqld:uid=999,gid=999,mode=0700,size=16m
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      # `mariadb-admin ping` exits 0 whenever the server answers (even on
      # access-denied). During init the temp server uses --skip-networking, so a
      # TCP ping only succeeds once the real server is up and users are created.
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 --silent || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - labnet

networks:
  labnet:
    name: websec-lab_sqli-layerslider-unauth-time-blind_net
    driver: bridge
    # Dedicated per-lab bridge. Not `internal: true`: Docker disables host port
    # publishing on internal networks, and the learner reaches the app via its
    # published 127.0.0.1 port. The DB publishes no ports at all.
    internal: false
