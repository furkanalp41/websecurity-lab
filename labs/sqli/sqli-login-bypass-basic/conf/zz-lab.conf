# Loaded after the main httpd.conf (IncludeOptional conf.d/*.conf); last-wins for
# single-value directives. Extensionless routes come from MultiViews (mod_negotiation),
# because mod_rewrite is not loaded on the Alpine apache2 build.
ServerName localhost
DocumentRoot "/var/www/html"
DirectoryIndex index.php
PidFile /tmp/httpd.pid
Mutex file:/tmp default
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

# mod_php registers .php only via SetHandler/FilesMatch; teach mod_mime the
# extension so MultiViews can negotiate extensionless URLs (/admin/login -> login.php).
AddType application/x-httpd-php .php

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride None
    Require all granted
</Directory>
