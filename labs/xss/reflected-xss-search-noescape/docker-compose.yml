# SPDX-License-Identifier: MIT
name: websec-lab-reflected-xss-search-noescape

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/reflected-xss-search-noescape:dev
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      BOT_KEY: xss-bot-shared-key
      BACKEND_CIDR: 172.31.240.0/24
      OOB_HOST: collector
      OOB_PORT: '9000'
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/lab:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8080/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - edge
      - backend

  collector:
    # Reuses the app image; overridden entrypoint runs the stdlib OOB collector.
    image: websec-lab/reflected-xss-search-noescape:dev
    depends_on:
      app:
        condition: service_started
    entrypoint: ['python', '/opt/app/collector.py']
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 50
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:9000/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

  bot:
    # The shared xss-verifier victim bot (headless Chromium). Built from the
    # package context so this lab literally imports @websec-lab/xss-verifier.
    # Tagged under xssbot/ (not websec-lab/) because it is browser INFRA — like a
    # pulled DB engine — not the size-gated lab app image.
    build:
      context: ../../../packages/xss-verifier
      dockerfile: Dockerfile
    image: xssbot/reflected-xss-search-noescape:dev
    depends_on:
      app:
        condition: service_healthy
    environment:
      XSSBOT_ORIGIN: http://app:8080
      XSSBOT_LOGIN_URL: /internal/bot-login?k=xss-bot-shared-key
      XSSBOT_QUEUE_URL: http://app:8080/internal/queue
      XSSBOT_INTERVAL: '2'
      XSSBOT_SETTLE_MS: '1200'
    read_only: true
    tmpfs:
      # Chromium scratch (temp profile, shm fallback) + the heartbeat file.
      - /tmp:exec,size=256m,mode=1777
      - /home/botuser:uid=10001,gid=10001,mode=0770,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/xssbot.alive || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

networks:
  edge:
    name: websec-lab_reflected-xss_edge
    driver: bridge
    internal: false
  # Egress-drop + fixed subnet: the admin bot and collector live here with no
  # route off the host, so a stolen cookie can only reach the in-lab collector,
  # never the internet. The fixed subnet backs the app's /internal/* firewall.
  backend:
    name: websec-lab_reflected-xss_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
