# SPDX-License-Identifier: MIT
name: websec-lab-stored-xss-comment-plain

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: websec-lab/stored-xss-comment-plain:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_USER_SECRET: ${LAB_USER_SECRET:?LAB_USER_SECRET is required}
      FLAG_PATH: /var/lib/lab/flag.txt
      DJANGO_SECRET_KEY: lab-insecure-key-not-a-flag
      BOT_KEY: xss-bot-shared-key
      BACKEND_CIDR: 172.31.240.0/24
      OOB_HOST: collector
      OOB_PORT: '9000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: blog
      DB_USER: blog
      DB_PASSWORD: blog-app-pw
    ports:
      - '127.0.0.1:${LAB_HOST_PORT:-0}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/lab:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile: { soft: 1024, hard: 2048 }
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8080/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - edge
      - backend

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    user: '70:70'
    command: [postgres, -c, fsync=off, -c, full_page_writes=off, -c, shared_buffers=64MB]
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog-app-pw
      POSTGRES_DB: blog
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=192m
      - /run/postgresql:uid=70,gid=70,size=8m
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog -h 127.0.0.1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

  collector:
    image: websec-lab/stored-xss-comment-plain:dev
    depends_on:
      app:
        condition: service_started
    entrypoint: ['python', '/opt/app/collector.py']
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 50
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:9000/health'').read()==b''ok'' else 1)" || exit 1'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

  bot:
    build:
      context: ../../../packages/xss-verifier
      dockerfile: Dockerfile
    image: xssbot/stored-xss-comment-plain:dev
    depends_on:
      app:
        condition: service_healthy
    environment:
      XSSBOT_ORIGIN: http://app:8080
      XSSBOT_LOGIN_URL: /internal/bot-login?k=xss-bot-shared-key
      # Stored XSS: the bot visits the admin moderation page every loop (no queue).
      XSSBOT_FIXED_URL: /admin/moderate
      XSSBOT_INTERVAL: '2'
      XSSBOT_SETTLE_MS: '1500'
    read_only: true
    tmpfs:
      - /tmp:exec,size=256m,mode=1777
      - /home/botuser:uid=10001,gid=10001,mode=0770,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/xssbot.alive || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    networks:
      - backend

networks:
  edge:
    name: websec-lab_stored-xss_edge
    driver: bridge
    internal: false
  backend:
    name: websec-lab_stored-xss_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24
